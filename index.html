<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> 🎼 모비긱스들의 플레이리스트 🎵</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fef9f0;--card:#fff;--border:#f0e8d8;--border2:#e8d8c0;
  --text:#2d2118;--muted:#9c8b7a;--accent:#e85d3a;--yellow:#f5a623;
  --shadow:0 2px 12px rgba(80,40,10,0.07);--shadow-h:0 6px 20px rgba(80,40,10,0.13);
}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;
  background-image:radial-gradient(ellipse at 5% 10%,rgba(232,93,58,.05) 0%,transparent 55%),
    radial-gradient(ellipse at 95% 90%,rgba(91,141,238,.05) 0%,transparent 55%);}

.hero{max-width:860px;margin:0 auto;padding:64px 32px 0;text-align:center}
.badge{display:inline-flex;align-items:center;gap:6px;background:#fff8ed;border:1.5px solid #f5c87a;
  border-radius:100px;padding:6px 18px;font-size:12px;font-weight:500;color:#b07a1f;margin-bottom:22px}
.hero-title{font-family:'Gowun Dodum',sans-serif;font-size:clamp(30px,5.5vw,50px);
  line-height:1.25;color:var(--text);margin-bottom:14px}
.hero-title .hl{color:var(--accent);position:relative;display:inline-block}
.hero-title .hl::after{content:'';position:absolute;bottom:0;left:0;right:0;height:4px;
  background:var(--yellow);border-radius:2px;opacity:.5}
.hero-sub{font-size:14px;color:var(--muted);line-height:1.9;max-width:440px;margin:0 auto 28px}
.stats{display:inline-flex;gap:24px;align-items:center;background:#fff;
  border:1.5px solid var(--border2);border-radius:100px;padding:10px 28px;
  font-size:12.5px;color:var(--muted);margin-bottom:48px;box-shadow:var(--shadow)}
.stats b{color:var(--text)}
.dot{width:3px;height:3px;border-radius:50%;background:var(--border2)}

.filters{max-width:860px;margin:0 auto 36px;padding:0 32px}
.filter-row{display:flex;flex-wrap:wrap;gap:7px;}
.fbtn{flex-shrink:0;padding:7px 16px;border-radius:100px;border:1.5px solid var(--border2);
  background:#fff;color:var(--muted);font-size:12px;font-weight:500;
  font-family:'Noto Sans KR',sans-serif;cursor:pointer;transition:all .16s;white-space:nowrap}
.fbtn:hover{border-color:var(--accent);color:var(--accent)}
.fbtn.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 3px 10px rgba(232,93,58,.3)}

.main{max-width:860px;margin:0 auto;padding:0 32px 100px}
.gsec{margin-bottom:48px}
.ghdr{display:flex;align-items:center;gap:10px;margin-bottom:14px;
  padding-bottom:14px;border-bottom:2px dashed var(--border2)}
.gico{width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px}
.gname{font-family:'Gowun Dodum',sans-serif;font-size:17px;font-weight:700}
.gcnt{margin-left:auto;font-size:11px;font-weight:600;background:#fff8ed;color:#b07a1f;
  border:1px solid #f5c87a;padding:3px 10px;border-radius:100px}

.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:8px}
.scard{display:flex;align-items:center;gap:12px;padding:12px 13px;background:var(--card);
  border:1.5px solid var(--border);border-radius:14px;text-decoration:none;color:inherit;
  transition:all .16s;position:relative;overflow:hidden}
.scard::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;
  background:var(--c,var(--accent));transform:scaleX(0);transform-origin:left;
  transition:transform .2s;border-radius:0 0 14px 14px}
.scard:hover{border-color:var(--c,var(--accent));box-shadow:var(--shadow-h);transform:translateY(-2px)}
.scard:hover::after{transform:scaleX(1)}
.scard:hover .pico{opacity:1;transform:scale(1)}
.scard.nlink{cursor:default}
.scard.nlink:hover{transform:none;box-shadow:none;border-color:var(--border)}
.scard.nlink:hover::after{transform:scaleX(0)}
.tnum{font-size:10.5px;color:var(--border2);min-width:18px;text-align:right}
.sinf{flex:1;min-width:0}
.stit{font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
.sart{font-size:11.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pico{width:26px;height:26px;border-radius:50%;background:var(--c,var(--accent));
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  opacity:0;transform:scale(.7);transition:all .15s}
.pico svg{width:9px;height:9px;fill:#fff;margin-left:1px}

footer{text-align:center;padding:48px 32px;font-size:12px;color:var(--muted);line-height:2.2}
footer img{height:36px;display:block;margin:0 auto 8px}
@media(max-width:560px){
  .hero,.filters,.main{padding-left:20px;padding-right:20px}
  .hero{padding-top:48px}
  .sgrid{grid-template-columns:1fr}
  .stats{flex-direction:column;gap:4px;border-radius:16px}
  .dot{display:none}
}
</style>
</head>
<body>

<div class="hero">
  <div class="badge">🎶 모비 4월 크크런치 · 2026</div>
  <h1 class="hero-title">모비긱스의<br><span class="hl">음악취향</span> 은? 🎵</h1>
  <p class="hero-sub">
    모비긱스들이 직접 고른 노래들을 모아봤어요!<br>
    클릭하면 유튜브로 바로 들을 수 있어요 🎧
  </p>
  <div class="stats">
    <span><b id="gc">—</b> 개 장르</span>
    <div class="dot"></div>
    <span><b id="sc">—</b> 곡</span>
  </div>
</div>

<div class="filters"><div class="filter-row" id="fb">
  <button class="fbtn on" data-g="all">🎵 전체</button>
</div></div>

<main class="main" id="mc"></main>

const total=D.reduce((s,g)=>s+g.s.length,0);
document.getElementById('gc').textContent=D.length;
document.getElementById('sc').textContent=total;

const fb=document.getElementById('fb');
D.forEach(g=>{
  const b=document.createElement('button');
  b.className='fbtn';b.dataset.g=g.n;
  b.textContent=g.e+' '+g.n;
  fb.appendChild(b);
});

const mc=document.getElementById('mc');
function render(f){
  mc.innerHTML='';
  D.forEach(g=>{
    if(f!=='all'&&g.n!==f)return;
    const sec=document.createElement('section');
    sec.className='gsec';
    sec.innerHTML=`
      <div class="ghdr">
        <div class="gico" style="background:${g.c}22">${g.e}</div>
        <span class="gname">${g.n}</span>
        <span class="gcnt">${g.s.length}곡</span>
      </div>`;
    const grid=document.createElement('div');
    grid.className='sgrid';
    g.s.forEach((s,i)=>{
      const el=document.createElement(s.u?'a':'div');
      el.className='scard'+(s.u?'':' nlink');
      el.style.setProperty('--c',g.c);
      if(s.u){el.href=s.u;el.target='_blank';el.rel='noopener';}
      el.innerHTML=`
        <span class="tnum">${String(i+1).padStart(2,'0')}</span>
        <div class="sinf">
          <div class="stit">${s.t||s.a}</div>
          ${s.t&&s.a?`<div class="sart">${s.a}</div>`:''}
        </div>
        ${s.u?`<div class="pico"><svg viewBox="0 0 10 12"><polygon points="0,0 10,6 0,12"/></svg></div>`:''}`;
      grid.appendChild(el);
    });
    sec.appendChild(grid);
    mc.appendChild(sec);
  });
}

render('all');
fb.addEventListener('click',e=>{
  const b=e.target.closest('.fbtn');
  if(!b)return;
  fb.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  render(b.dataset.g);
});
